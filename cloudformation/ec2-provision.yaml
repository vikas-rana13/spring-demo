AWSTemplateFormatVersion: '2010-09-09'
Description: 'Enterprise-grade, fully parameterized application hosting stack.'

Parameters:
  AppName:
    Type: String
    Description: 'Name of the business service.'
  KeyName:
    Type: 'AWS::EC2::KeyPair::KeyName'
    Description: 'KeyPair for SSH management.'
  AppPort:
    Type: Number
    Default: 8080
    Description: 'The port the application binds to.'
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64'

Resources:
  AppSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub 'Security Group for ${AppName}'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        # Dynamic Application Port Authorization
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          CidrIp: 0.0.0.0/0

  AppEC2Instance:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      ImageId: !Ref LatestAmiId
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      # Generic bootstrap to enable remote workspace management
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Securely establish generic workspace for deploying scripts
          mkdir -p /home/ec2-user/app
          chown -R ec2-user:ec2-user /home/ec2-user/app
          chmod -R 755 /home/ec2-user/app
      Tags:
        - Key: Name
          Value: !Ref AppName

Outputs:
  EC2PublicIP:
    Description: 'Public target IP of the instance.'
    Value: !GetAtt AppEC2Instance.PublicIp
