AWSTemplateFormatVersion: '2010-09-09'
Description: 'Simplified AWS Stack for Docker Hub Deployments.'

Parameters:
  AppName:
    Type: String
    Description: 'The name of the application.'
  KeyName:
    Type: 'AWS::EC2::KeyPair::KeyName'
    Description: 'KeyPair for SSH management.'
  AppPort:
    Type: Number
    Default: 8080
    Description: 'The port the application binds to.'
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64'

Resources:
  # 1. Host Security Group (Firewall) - Only opens SSH and your Spring Boot Port
  AppSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub 'Security Group for ${AppName}'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          CidrIp: 0.0.0.0/0

  # 2. EC2 Web Server with Initial Directory Setup (No AWS ECR Roles needed!)
  AppEC2Instance:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      ImageId: !Ref LatestAmiId
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Setup workspace directory owned by ec2-user
          mkdir -p /home/ec2-user/app
          chown -R ec2-user:ec2-user /home/ec2-user/app
          chmod -R 755 /home/ec2-user/app
      Tags:
        - Key: Name
          Value: !Ref AppName

Outputs:
  EC2PublicIP:
    Description: 'Public IP of the instance.'
    Value: !GetAtt AppEC2Instance.PublicIp
